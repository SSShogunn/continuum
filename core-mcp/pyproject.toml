[project]
name = "continuum-core"
version = "0.1.0"
description = "MCP server for persistent, personal agent memory — atomic fact extraction, vector recall over pgvector, and auto-injected context"
requires-python = ">=3.13,<3.14"
keywords = ["mcp", "model-context-protocol", "fastmcp", "ai-memory", "pgvector", "embeddings", "rag", "llm"]

dependencies = [
    "alembic>=1.13.0",
    "arq>=0.28.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "litellm>=1.92.0",
    "orjson>=3.11.9",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://continuum.sshogunn.org"
Repository = "https://github.com/SSShogunn/continuum"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "watchfiles>=1.2.0",
]
