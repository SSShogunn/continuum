services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: continuum-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8789
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: continuum-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - core-mcp

  core-mcp:
    build:
      context: ./core-mcp
      dockerfile: Dockerfile.prod
    container_name: continuum-core-mcp
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./core-mcp/.env
    depends_on:
      - searxng
      - redis

  worker:
    build:
      context: ./core-mcp
      dockerfile: Dockerfile.prod
    container_name: continuum-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./core-mcp/.env
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: continuum-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data

  searxng:
    image: searxng/searxng:latest
    container_name: continuum-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: continuum-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
      - core-mcp

volumes:
  redis-data:
