name: Release hook scripts

# Publishes hooks/ as assets on two rolling releases, so core-mcp's
# install/update endpoints can redirect to GitHub's release CDN
# (release-assets.githubusercontent.com) instead of raw.githubusercontent.com,
# which rate-limits and 403s under load. Both releases always track main.
#
#   hooks-latest  — install_hook.js / uninstall_hook.js: the only files a
#                   person is ever meant to look at or run by hand (curl|node
#                   / irm|node).
#   hooks-payload — the continuum_*.js implementation those two fetch
#                   silently, plus what the background updater re-checks
#                   daily. Kept off hooks-latest so that release page shows
#                   just the script, not its internals.
#
# All Node now — there's no separate Python runtime to bootstrap into, so
# unlike the old .sh/.ps1 pair this needs no per-platform variants.

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish hooks-latest and hooks-payload releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view hooks-latest >/dev/null 2>&1; then
            gh release create hooks-latest \
              --title "Hook scripts (latest)" \
              --notes "Install/uninstall entrypoints for Continuum's Claude Code hooks, tracking the tip of main. Requires Node 18+. Source: hooks/ in this repo."
          fi
          gh release upload hooks-latest \
            hooks/install_hook.js hooks/uninstall_hook.js \
            --clobber

          if ! gh release view hooks-payload >/dev/null 2>&1; then
            gh release create hooks-payload \
              --title "Hook payload (latest)" \
              --notes "Implementation fetched by the hooks-latest entrypoints and the background updater — not meant to be run by hand. Source: hooks/ in this repo." \
              --prerelease
          fi
          gh release upload hooks-payload \
            hooks/continuum_context_inject.js hooks/continuum_session_capture.js \
            hooks/continuum_self_update.js \
            --clobber
