name: Release hook scripts

# Publishes hooks/ as assets on two rolling releases, so core-mcp's
# install/update endpoints can redirect to GitHub's release CDN
# (release-assets.githubusercontent.com) instead of raw.githubusercontent.com,
# which rate-limits and 403s under load. Both releases always track main.
#
#   hooks-latest  — install-hook/uninstall-hook .sh + .ps1 bootstraps: the only
#                   files a person is ever meant to look at or run by hand.
#   hooks-payload — the continuum_*.py / install_hook.py / uninstall_hook.py
#                   implementation, fetched silently by the bootstraps and the
#                   background updater. Kept off hooks-latest so that release
#                   page shows just the script, not its Python internals.

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish hooks-latest and hooks-payload releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view hooks-latest >/dev/null 2>&1; then
            gh release create hooks-latest \
              --title "Hook scripts (latest)" \
              --notes "Install/uninstall bootstraps for Continuum's Claude Code hooks, tracking the tip of main. Source: hooks/ in this repo."
          fi
          gh release upload hooks-latest \
            hooks/install-hook.sh hooks/install-hook.ps1 \
            hooks/uninstall-hook.sh hooks/uninstall-hook.ps1 \
            --clobber

          if ! gh release view hooks-payload >/dev/null 2>&1; then
            gh release create hooks-payload \
              --title "Hook payload (latest)" \
              --notes "Python implementation fetched by the hooks-latest bootstraps and the background updater — not meant to be run by hand. Source: hooks/ in this repo." \
              --prerelease
          fi
          gh release upload hooks-payload \
            hooks/install_hook.py hooks/uninstall_hook.py \
            hooks/continuum_context_inject.py hooks/continuum_session_capture.py \
            hooks/continuum_self_update.py \
            --clobber
