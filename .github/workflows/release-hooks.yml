name: Release hook scripts

# Publishes hooks/*.{py,sh,ps1} as assets on a single rolling "hooks-latest"
# release, so core-mcp's install/update endpoints can redirect to GitHub's
# release CDN (objects.githubusercontent.com) instead of raw.githubusercontent.com,
# which rate-limits and 403s under load. The release always tracks main.

on:
  push:
    branches: [main]
    paths:
      - "hooks/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish hooks-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view hooks-latest >/dev/null 2>&1; then
            gh release create hooks-latest \
              --title "Hook scripts (latest)" \
              --notes "Auto-published Claude Code hook scripts, tracking the tip of main. Source: hooks/ in this repo."
          fi
          gh release upload hooks-latest hooks/*.py hooks/*.sh hooks/*.ps1 --clobber
