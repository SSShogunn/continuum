server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must be revalidated so deploys are picked up on refresh.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for client-side routing (React Router).
    location / {
        try_files $uri /index.html;
    }
}
