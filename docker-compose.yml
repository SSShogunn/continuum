services:
  frontend:
    build: ./frontend
    container_name: continuum-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./backend
    container_name: continuum-backend
    restart: unless-stopped
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/main.py:/app/main.py
    env_file:
      - ./backend/.env
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn main:app --host 0.0.0.0 --port 8789 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8789/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      core-mcp:
        condition: service_started
      postgres:
        condition: service_healthy

  core-mcp:
    build: ./core-mcp
    container_name: continuum-core-mcp
    restart: unless-stopped
    volumes:
      - ./core-mcp:/app
      - core-mcp-venv:/app/.venv
    env_file:
      - ./core-mcp/.env
    command: ["sh", "-c", "uv run alembic upgrade head && uv run watchfiles 'python -m app.server' /app"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8788), timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      searxng:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./core-mcp
    container_name: continuum-worker
    restart: unless-stopped
    volumes:
      - ./core-mcp:/app
      - core-mcp-venv:/app/.venv
    env_file:
      - ./core-mcp/.env
    command: ["uv", "run", "arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: continuum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: continuum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum -d continuum -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: continuum-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  searxng:
    image: searxng/searxng:latest
    container_name: continuum-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: continuum-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      core-mcp:
        condition: service_started

volumes:
  core-mcp-venv:
  postgres-data:
  redis-data:
